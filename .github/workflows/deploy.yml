name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install VitePress
        run: npm add -D vitepress

      - name: Initialize VitePress
        run: npx vitepress init

      - name: Build documentation
        run: npx vitepress build docs

      - name: Show build output (debug)
        run: |
          echo "Listing docs/.vitepress/dist"
          ls -la docs/.vitepress/dist || true

      - name: Prepare artifact for Pages
        run: |
          rm -rf out
          mkdir out
          cp -R docs/.vitepress/dist/* out/
          echo "Listing out/"
          ls -la out || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions-deploy-pages@v4
